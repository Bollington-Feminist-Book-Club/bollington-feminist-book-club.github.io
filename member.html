<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member – Bollington Feminist Book Club</title>
  <meta name="description" content="A member of the Bollington Feminist Book Club.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://sitjart.github.io/bollington-book-club/member.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bollington Feminist Book Club">
  <meta property="og:title" content="Member – Bollington Feminist Book Club">
  <meta property="og:description" content="A member of the Bollington Feminist Book Club.">
  <meta property="og:url" content="https://sitjart.github.io/bollington-book-club/member.html">
  <meta property="og:image" content="https://sitjart.github.io/bollington-book-club/assets/share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
      if (localStorage.getItem("reading") === "easy") document.documentElement.setAttribute("data-reading", "easy");
    } catch (e) {}
  </script>
  <script>
    // Always load the latest code: a new value every minute stops browsers using stale copies
    window.__v = Math.floor(Date.now() / 60000);
    document.write('<link rel="stylesheet" href="styles.css?v=' + __v + '">');
    document.write('<script src="config.js?v=' + __v + '"><\/script>');
  </script>
</head>
<body data-page="member">
  <a class="skip" href="#main">Skip to content</a>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="./" data-club-name>Bollington Feminist Book Club</a>
      <nav class="nav" aria-label="Main">
        <a href="books.html" data-page="books">Books</a>
        <a href="wishlist.html" data-page="wishlist">Wish list</a>
        <a href="members.html" data-page="members">Members</a>
        <a href="about.html" data-page="about">About</a>
        <a class="button button--small" data-form="join" href="#">Join</a>
        <span class="nav__tools">
          <button class="read-toggle" type="button" aria-pressed="false" title="Easier reading: bigger, more spaced text with no background patterns">Aa<span class="visually-hidden"> Easier reading</span></button>
          <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
            <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
          </button>
        </span>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section container page member">
      <p class="member__back"><a href="members.html">← All members</a></p>
      <div class="member__head" id="m-head"><p class="count">Loading…</p></div>

      <div class="section__head"><h2 class="section__title">On their shelf</h2></div>
      <div class="grid" id="m-shelf"></div>

      <div class="section__head"><h2 class="section__title">Borrowing now</h2></div>
      <ul class="loans" id="m-active"></ul>

      <div class="section__head"><h2 class="section__title">Read before</h2></div>
      <ul class="loans" id="m-past"></ul>

      <div class="section__head"><h2 class="section__title">Ratings</h2></div>
      <ul class="loans" id="m-ratings"></ul>
    </section>
  </main>

  <footer class="footer container">
    <span>© <span id="year"></span> <span data-club-name>Bollington Feminist Book Club</span> · <a href="mailto:bollyfem-bookclub@googlegroups.com">bollyfem-bookclub@googlegroups.com</a></span>
    <span><a href="add.html">Add a book</a> · <a data-form="rate" href="#">Rate a book</a> · <a data-form="recommend" href="#">Recommend a book</a></span>
  </footer>

  <dialog id="book-dialog" aria-labelledby="d-title">
    <button class="close" type="button" aria-label="Close">×</button>
    <div class="dialog__body" id="d-body"></div>
  </dialog>

  <script>document.write('<script src="app.js?v=' + window.__v + '"><\/script>');</script>
</body>
</html>
